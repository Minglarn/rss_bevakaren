server {
    listen 80;
    server_name localhost;
    access_log off;

    # Återställ äkta klient-IP bakom reverse proxy och Docker-nätverk
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Logga och vidarebefordra sårbarhetsskanningar till backend honeypot för automatisk IP-spärr (IP-Jail)
    location ~* (^|/)(\.git|\.env|\.aws|\.ssh|\.local|\.config|credentials|service-account|firebase.*admin|secrets?\.json|sa\.json|gcp-.*\.json|.*service_account.*\.json|_payload\.json|.*\.php|.*\.py|.*\.sql|wp-login|wp-admin|actuator|setup\.cgi|debug)$ {
        access_log /dev/stdout;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        
        # Stäng av cachning för HTML och Service Worker så att nya versioner upptäcks direkt
        location ~* \.html$ {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
        }
        
        location = /sw.js {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
        }

        location ~* \.(json|webmanifest)$ {
            add_header Cache-Control "no-cache, must-revalidate";
            expires 0;
            try_files $uri =404;
        }

        location ~* (badge\.png|favicon\.png|icon-.*\.png|pwa-.*\.png|default-feed-icon\.(png|svg))$ {
            add_header Cache-Control "no-cache, must-revalidate";
            expires 0;
        }
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Hide upstream Date header to prevent duplicate header warning (Nginx adds its own)
        proxy_hide_header Date;
        proxy_hide_header date;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        
        # Öka buffertarna för att hantera stora JSON-svar utan att skriva till disk
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
