# version: '3.8'

services:
  backend:
    image: ghcr.io/minglarn/rss_bevakaren_backend:main
    ports:
      - "8094:8000"
    volumes:
      # Lagra databasen i en dedikerad data-mapp på hosten så den överlever omstarter
      - ./data:/data
    environment:
      - TZ=Europe/Stockholm
      - DATABASE_URL=sqlite:////data/rss.db
      # Multi-user setup: Separera med kommatecken. Ordningen matchar.
      - APP_USERNAME=admin,wife
      - APP_PASSWORD=admin_password,wife_password
      # LM Studio AI-inställningar (IP på lokala nätverket)
      - LM_STUDIO_URL=http://192.168.1.239:1234/v1/chat/completions
      - LM_STUDIO_MODEL=   # Lämna tomt för att använda aktiv modell i LM Studio, eller ange t.ex. gemma4-e4b
      - LM_STUDIO_TIMEOUT=120  # Timeout i sekunder (rekommenderat 120s för lokala modeller)
      - AI_MAX_ARTICLE_AGE_HOURS=24  # Bearbeta endast artiklar från de senaste 24 timmarna (hoppar över gammal historik)
      # MQTT-stöd (valfritt, avaktiverat som standard)
      - MQTT_ENABLED=false
      - MQTT_BROKER=192.168.1.50
      - MQTT_PORT=1883
      - MQTT_USERNAME=
      - MQTT_PASSWORD=
      - MQTT_TOPIC_PREFIX=rss_bevakaren
    restart: unless-stopped

  frontend:
    image: ghcr.io/minglarn/rss_bevakaren_frontend:main
    ports:
      - "8093:80"
    environment:
      - TZ=Europe/Stockholm
      - VITE_API_URL=http://localhost:8000
    restart: unless-stopped
    depends_on:
      - backend
