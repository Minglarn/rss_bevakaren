# version: '3.8'

services:
  backend:
    image: ghcr.io/minglarn/rss_bevakaren_backend:main
    ports:
      - "8094:8000"
    volumes:
      # Lagra databasen i en dedikerad data-mapp på hosten så den överlever omstarter
      - ./data:/data
    environment:
      - TZ=Europe/Stockholm
      - DATABASE_URL=sqlite:////data/rss.db
      # Fleranvändarstöd: Separera användarnamn och lösenord med kommatecken för flera konton
      - APP_USERNAME=admin,anvandare2
      - APP_PASSWORD=ditt_sakna_losenord,andra_losenordet
      # Valfri JWT-hemlighet (om den utelämnas genereras en slumpmässig nyckel automatiskt i /data)
      # - SECRET_KEY=byt_till_en_hemlig_slumpmassig_strang
      # Lokal AI via LM Studio, Ollama eller valfritt OpenAI-kompatibelt API (IP på lokala nätverket)
      - LM_STUDIO_URL=http://192.168.1.50:1234/v1/chat/completions
      - LM_STUDIO_MODEL= # Lämna tomt för att använda aktiv modell i LM Studio, eller ange t.ex. gemma4-e4b
      - LM_STUDIO_TIMEOUT=120 # Timeout i sekunder (rekommenderat 120s för lokala modeller)
      - AI_MAX_ARTICLE_AGE_HOURS=24 # Bearbeta endast artiklar från de senaste 24 timmarna (hoppar över gammal historik)
      # MQTT-stöd (valfritt, avaktiverat som standard)
      - MQTT_ENABLED=false
      - MQTT_BROKER=192.168.1.50
      - MQTT_PORT=1883
      - MQTT_USERNAME=
      - MQTT_PASSWORD=
      - MQTT_TOPIC_PREFIX=rss_bevakaren
      - MQTT_RETAIN=true # Behåll senaste meddelandet i brokern (persistent över omstarter)
    restart: unless-stopped

  frontend:
    image: ghcr.io/minglarn/rss_bevakaren_frontend:main
    ports:
      - "8093:80"
    environment:
      - TZ=Europe/Stockholm
      - VITE_API_URL=http://localhost:8000
    restart: unless-stopped
    depends_on:
      - backend
