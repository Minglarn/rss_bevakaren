name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
      - beta
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from package.json
        id: get_version
        run: echo "VERSION=$(jq -r .version frontend/package.json)" >> $GITHUB_ENV

      - name: Determine Docker Tags
        id: docker_tags
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "BACKEND_TAGS=ghcr.io/minglarn/rss_bevakaren_backend:latest,ghcr.io/minglarn/rss_bevakaren_backend:${{ github.sha }},ghcr.io/minglarn/rss_bevakaren_backend:main" >> $GITHUB_ENV
            echo "FRONTEND_TAGS=ghcr.io/minglarn/rss_bevakaren_frontend:latest,ghcr.io/minglarn/rss_bevakaren_frontend:${{ github.sha }},ghcr.io/minglarn/rss_bevakaren_frontend:main" >> $GITHUB_ENV
          else
            echo "BACKEND_TAGS=ghcr.io/minglarn/rss_bevakaren_backend:${{ github.ref_name }},ghcr.io/minglarn/rss_bevakaren_backend:${{ github.sha }}" >> $GITHUB_ENV
            echo "FRONTEND_TAGS=ghcr.io/minglarn/rss_bevakaren_frontend:${{ github.ref_name }},ghcr.io/minglarn/rss_bevakaren_frontend:${{ github.sha }}" >> $GITHUB_ENV
          fi

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          build-args: |
            APP_VERSION=${{ env.VERSION }}
          tags: ${{ env.BACKEND_TAGS }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.FRONTEND_TAGS }}

